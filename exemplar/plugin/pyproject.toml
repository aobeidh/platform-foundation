[project]
name = "exemplar-echo-connector"
version = "0.3.0"
description = "Exemplar connector plugin, packaged exactly like a third-party plugin."
requires-python = ">=3.12"
dependencies = ["platform-plugin-sdk"]

[project.entry-points."exemplar.connectors"]
echo = "exemplar_echo_connector:EchoConnector"

[tool.uv.sources]
platform-plugin-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
