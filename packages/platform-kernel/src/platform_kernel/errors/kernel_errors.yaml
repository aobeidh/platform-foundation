# Error codes owned by the kernel. Products add their own catalogs (P51).
INTERNAL_ERROR:        {status: 500, retryable: true,  title: Internal error, remedy: Retry later. If it persists, contact support with the correlation ID.}
VALIDATION_FAILED:     {status: 422, retryable: false, title: Validation failed, remedy: Correct the fields listed in errors and send the request again.}
UNAUTHENTICATED:       {status: 401, retryable: false, title: Authentication required, remedy: Send a valid bearer token.}
TOKEN_INVALID:         {status: 401, retryable: false, title: Token not valid, remedy: Obtain a new token from the identity provider.}
TOKEN_EXPIRED:         {status: 401, retryable: false, title: Token expired, remedy: Obtain a new token from the identity provider.}
FORBIDDEN:             {status: 403, retryable: false, title: Not allowed, remedy: Ask an administrator for a role that grants this capability.}
NOT_FOUND:             {status: 404, retryable: false, title: Not found, remedy: Check the identifier.}
CONFLICT:              {status: 409, retryable: false, title: Conflict, remedy: Reload the resource and apply your change again.}
REVISION_CONFLICT:     {status: 409, retryable: false, title: Revision conflict, remedy: Someone changed this record. Reload it and apply your change again.}
IDEMPOTENCY_KEY_REUSED: {status: 409, retryable: false, title: Idempotency key reused, remedy: Use a new Idempotency-Key for a different request.}
IDEMPOTENCY_IN_PROGRESS: {status: 409, retryable: true, title: Request in progress, remedy: Wait and retry with the same Idempotency-Key.}
PAYLOAD_TOO_LARGE:     {status: 413, retryable: false, title: Payload too large, remedy: Send a smaller body or use a claim check.}
DEADLINE_EXCEEDED:     {status: 504, retryable: true,  title: Deadline exceeded, remedy: Retry with a longer deadline or try later.}
DEPENDENCY_UNAVAILABLE: {status: 503, retryable: true, title: Dependency unavailable, remedy: Retry later.}
EGRESS_BLOCKED:        {status: 403, retryable: false, title: Outbound call blocked, remedy: Ask an administrator to approve the host in the egress policy.}
INVALID_TRANSITION:    {status: 409, retryable: false, title: Transition not allowed, remedy: Check the record's current state.}
MAKER_CHECKER:         {status: 403, retryable: false, title: Second person required, remedy: Ask a different person to approve.}
NOT_TESTED:            {status: 409, retryable: false, title: Test required, remedy: Run the test and fix any failed checks before submitting.}
NO_DRAFT:              {status: 409, retryable: false, title: No draft, remedy: Edit the record to start a draft.}
DRAFT_SUBMITTED:       {status: 409, retryable: false, title: Waiting for approval, remedy: Wait for the approver, or ask them to return the version.}
NOT_SUBMITTED:         {status: 409, retryable: false, title: Nothing to approve, remedy: Submit the version first.}
NOT_ACTIVE:            {status: 409, retryable: false, title: Not active, remedy: Only an active record can be paused.}
NOT_PAUSED:            {status: 409, retryable: false, title: Not paused, remedy: Only a paused record can be resumed.}
RECORD_RETIRED:        {status: 409, retryable: false, title: Retired, remedy: A retired record cannot change; create a new one.}
PLUGIN_NOT_FOUND:      {status: 404, retryable: false, title: Plugin not found, remedy: Check the plugin id and version, or install the plugin.}
PLUGIN_FAILED:         {status: 502, retryable: true,  title: Plugin failed, remedy: Check the plugin's configuration and logs.}
EXPRESSION_INVALID:    {status: 422, retryable: false, title: Expression not valid, remedy: Correct the expression; the detail names the problem.}
EXPRESSION_FAILED:     {status: 422, retryable: false, title: Expression failed, remedy: Check the expression against the input data.}
EXPRESSION_LIMIT:      {status: 422, retryable: false, title: Expression limit reached, remedy: Simplify the expression or raise its limits.}
EXPRESSION_LANGUAGE_UNKNOWN: {status: 422, retryable: false, title: Expression language unknown, remedy: Use a configured language.}
