[project]
name = "platform-foundation-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "exemplar/service", "exemplar/plugin"]

[dependency-groups]
dev = [
  "platform-kernel[postgres]",
  "platform-plugin-sdk",
  "platform-testing",
  "platform-tools",
  "exemplar-connections",
  "exemplar-echo-connector",
  "pytest>=8.3",
  "import-linter>=2.1",
  "ruff>=0.7",
]

[tool.uv.sources]
platform-kernel = { workspace = true }
platform-plugin-sdk = { workspace = true }
platform-testing = { workspace = true }
platform-tools = { workspace = true }
exemplar-connections = { workspace = true }
exemplar-echo-connector = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages", "exemplar", "tests"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# B008: FastAPI declares parameters with Body() and Header() defaults. UP007/UP046: explicit Generic is kept.
ignore = ["B008", "UP007", "UP046"]
