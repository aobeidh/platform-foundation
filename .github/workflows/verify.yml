name: verify
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PF_TEST_DATABASE_URL: postgresql://app:app@localhost:5432/pf
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: Create a non-superuser test role, so row-level security is enforced
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "create role app login password 'app'"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "create database pf owner app"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pk check
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build          # tsc, eslint with the atomic layer rules, vite build
      - run: npm test               # conformance with the exemplar journey, provider rules, schema forms
      - run: npm run registry:build # the shadcn registry builds from source
      - run: npm run build:single   # the self-contained demo page
